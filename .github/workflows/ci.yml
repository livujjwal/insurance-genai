name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insurance_genai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Ruff Lint & Format Check
        working-directory: ./backend
        run: |
          ruff check .
          ruff format --check .

      - name: Type Check (mypy)
        working-directory: ./backend
        run: |
          mypy app

      - name: Run Pytest
        working-directory: ./backend
        env:
          ENVIRONMENT: test
          DEBUG: false
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/insurance_genai_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: testsecretkeyformypytestrunsatleastthirtytwochars
          ENCRYPTION_KEY: D7MvZ8q7X8zBqG2WjX8_4T7fN_3kY9pQ5mR1sT3vW4Y=
        run: |
          pytest -v tests/

  frontend-lint-and-typecheck:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: ./frontend
        run: npm run lint
