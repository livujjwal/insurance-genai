[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-genai-backend"
version = "0.1.0"
description = "Enterprise Insurance Claims & Policy Intelligence Assistant Backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Insurance GenAI Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.0.3",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "alembic>=1.13.2",
    "redis>=5.0.8",
    "arq>=0.26.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "litellm>=1.49.0",
    "sqlglot>=25.20.0",
    "pypdf>=4.3.0",
    "python-docx>=1.1.2",
    "markdown>=3.7",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.8",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
